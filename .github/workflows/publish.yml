name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check release state
        run: pnpm release:check

      - name: Build tokens
        run: pnpm --filter @ahomeyonglin/tokens build

      - name: Publish tokens
        working-directory: packages/tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@ahomeyonglin/tokens@$VERSION" version >/dev/null 2>&1; then
            echo "@ahomeyonglin/tokens@$VERSION 已存在，跳过发布"
          else
            npm publish --access public
          fi

      - name: Build ui
        run: pnpm --filter @ahomeyonglin/ui build

      - name: Publish ui
        working-directory: packages/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if npm view "@ahomeyonglin/ui@$VERSION" version >/dev/null 2>&1; then
            echo "@ahomeyonglin/ui@$VERSION 已存在，跳过发布"
          else
            npm publish --access public
          fi
