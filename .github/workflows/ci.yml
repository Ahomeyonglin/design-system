name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ -z "${{ github.event.before }}" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="v0.0.0..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          pnpm commit:check "$RANGE"

      - name: Check changelog freshness
        run: pnpm changelog:check

      - name: Build tokens
        run: pnpm --filter @ds/tokens build

      - name: Test tokens
        run: pnpm --filter @ds/tokens test

      - name: Lint components
        run: pnpm --filter @ds/ui lint

      - name: Typecheck components
        run: pnpm --filter @ds/ui typecheck

      - name: Regenerate registry
        run: pnpm --filter @ds/ui build:registry

      - name: Check registry drift
        run: git diff --exit-code -- packages/ui/registry.json

      - name: Check generated files are not tracked
        run: |
          TRACKED=$(git ls-files packages/tokens/dist)
          if [ -n "$TRACKED" ]; then
            echo "$TRACKED"
            exit 1
          fi

      - name: Lint docs
        run: pnpm --filter @ds/docs lint

      - name: Test docs
        run: pnpm --filter @ds/docs test

      - name: Build docs
        run: pnpm --filter @ds/docs build

      - name: Build docs with pages base
        run: VITE_BASE=/design-system/ pnpm --filter @ds/docs build
